<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <link rel="stylesheet" href="style/normalize.css" />
    <link rel="stylesheet" href="style/style.css" />

    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="results">
        <h1 class="reult-title hanken-grotesk-700">Your Result</h1>
        <div>
          <div class="result-number hanken-grotesk-800">76</div>
          <p class="grey-blue">of 100</p>
        </div>
        <h2 class="result-text hanken-grotesk-700">Great</h2>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>
      <section class="summary-stats">
        <h2 class="summary-heading hanken-grotesk-700">Summary</h2>
        <div class="pill reaction">
          <span class="label">Reaction</span>
          <span class="score"
            ><strong>80</strong> <span class="pill-of">/ 100</span></span
          >
        </div>
        <div class="pill memory">
          <span class="label">Memory</span>
          <span class="score"
            ><strong>92</strong> <span class="pill-of">/ 100</span></span
          >
        </div>
        <div class="pill verbal">
          <span class="label">Verbal</span>
          <span class="score"
            ><strong>61</strong> <span class="pill-of">/ 100</span></span
          >
        </div>
        <div class="pill visual">
          <span class="label">Visual</span>
          <span class="score"
            ><strong>72</strong><span class="pill-of"> / 100</span></span
          >
        </div>
        <span class="continue-button hanken-grotesk-700">Continue</span>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
