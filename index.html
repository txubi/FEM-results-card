<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <link rel="stylesheet" href="style/normalize.css" />
    <link rel="stylesheet" href="style/style.css" />

    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="results">
        <h1 class="reult-title hanken-grotesk-700">Your Result</h1>
        <div>
          <span class="result-number hanken-grotesk-800">76</span>
          <p>of 100</p>
        </div>
        <h2 class="result-text hanken-grotesk-700"><strong>Great</strong></h2>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>
      <section class="summary">
        <h2 class="summary-heading hanken-grotesk-700">Summary</h2>
        <div class="summary-stats">
          Reaction 80 / 100 Memory 92 / 100 Verbal 61 / 100 Visual 72 / 100
        </div>
        <span class="continue-button hanken-grotesk-700">Continue</span>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
