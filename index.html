<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <link rel="stylesheet" href="style/normalize.css" />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <main>
      <section class="results">
        <h1 class="reult-title hanken-grotesk-700">Your Result</h1>
        <div class="circle-results">
          <div class="result-number hanken-grotesk-800">76</div>
          <div class="result-number-of">of 100</div>
        </div>
        <div class="result-text">
          <h2 class="result-text-title hanken-grotesk-700">Great</h2>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
      </section>
      <section class="summary-stats">
        <h2 class="summary-heading hanken-grotesk-700">Summary</h2>
        <div class="pill reaction">
          <span class="label">Reaction</span>
          <span class="score"
            ><strong>80</strong> <span class="pill-of">/ 100</span></span
          >
        </div>
        <div class="pill memory">
          <span class="label">Memory</span>
          <span class="score"
            ><strong>92</strong> <span class="pill-of">/ 100</span></span
          >
        </div>
        <div class="pill verbal">
          <span class="label">Verbal</span>
          <span class="score"
            ><strong>61</strong> <span class="pill-of">/ 100</span></span
          >
        </div>
        <div class="pill visual">
          <span class="label">Visual</span>
          <span class="score"
            ><strong>72</strong><span class="pill-of"> / 100</span></span
          >
        </div>
        <span class="continue-button hanken-grotesk-700"><p>Continue</p></span>
      </section>
    </main>
  </body>
</html>
